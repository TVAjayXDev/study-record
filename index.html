<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Gradebook — CGPA tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    :root{--ink:#1e3028;--muted:#718077;--line:#e4e9e4;--paper:#fff;--canvas:#f5f7f4;--green:#236b4b;--lime:#d9ef8b;--mint:#eaf4ed;--orange:#ec8d5e;--red:#bd4c47;--shadow:0 14px 42px #20382a0d}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100vw - 1200px)/2));position:sticky;top:0;z-index:5}.brand{display:flex;gap:11px;align-items:center;font-weight:750;font-size:17px;letter-spacing:-.4px}.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--green);display:grid;place-items:center;color:var(--lime);font-size:18px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:550;letter-spacing:.7px;text-transform:uppercase}.user-tools{display:flex;align-items:center;gap:12px}.user-email{color:var(--muted);font-size:12px}.wrap{max-width:1200px;margin:0 auto;padding:34px 24px 70px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;color:var(--green)}h1{font-size:32px;line-height:1.15;letter-spacing:-1px;margin:8px 0}h2{font-size:18px;letter-spacing:-.3px;margin:0}.subhead{color:var(--muted);margin:8px 0 0}.heading-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:25px}.button{border:0;border-radius:10px;padding:10px 15px;font-size:13px;font-weight:700;transition:.15s}.button:hover{transform:translateY(-1px)}.primary{background:var(--green);color:white}.primary:hover{background:#195739}.soft{background:var(--mint);color:var(--green)}.ghost{background:transparent;color:var(--muted);padding:8px}.danger{color:var(--red);background:#fff2f0}.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:15px;margin-bottom:22px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:19px 21px;box-shadow:var(--shadow)}.stat.hero{background:var(--green);color:white;border-color:var(--green);position:relative;overflow:hidden}.stat.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #ffffff1e;border-radius:50%;right:-45px;top:-60px;box-shadow:0 0 0 22px #ffffff09,0 0 0 44px #ffffff06}.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}.hero .stat-label{color:#d4e7d8}.stat-number{font-size:38px;letter-spacing:-1.5px;font-weight:760;margin:5px 0 0;line-height:1.2}.stat-foot{font-size:12px;color:var(--muted);margin-top:4px}.hero .stat-foot{color:#d4e7d8}.stat:not(.hero) .stat-number{font-size:30px}.section{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:17px;box-shadow:var(--shadow)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section-head p{margin:4px 0 0;color:var(--muted);font-size:12px}.semester-list{display:grid;gap:14px}.semester-card{border:1px solid var(--line);border-radius:13px;overflow:hidden}.semester-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fbfcfa}.semester-head h3{font-size:14px;margin:0;font-weight:740}.sem-meta{font-size:11px;color:var(--muted);margin-top:2px}.sem-gpa{margin-left:auto;text-align:right}.sem-gpa strong{font-size:18px;display:block;line-height:1.2}.sem-gpa span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}.sem-actions{display:flex;gap:6px;margin-left:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:820px}th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);padding:10px 12px;background:#fff;border-bottom:1px solid var(--line)}td{padding:11px 12px;border-bottom:1px solid #edf0ed;font-size:12px;white-space:nowrap}tr:last-child td{border-bottom:0}.subject-name{font-weight:680;font-size:13px}.subscore{font-size:10px;color:var(--muted);margin-top:2px}.grade-pill{display:inline-flex;min-width:36px;justify-content:center;padding:4px 7px;border-radius:7px;background:var(--mint);color:var(--green);font-weight:750}.grade-pill.fail{background:#fff0ed;color:var(--red)}.row-actions{display:flex;gap:4px}.icon-btn{border:0;background:transparent;color:#78867c;border-radius:7px;padding:6px}.icon-btn:hover{background:#f1f4ef;color:var(--ink)}.empty{padding:27px 18px;text-align:center;color:var(--muted);font-size:12px}.charts{display:grid;grid-template-columns:1.2fr 1.1fr .8fr;gap:14px}.chart-card{border:1px solid var(--line);border-radius:13px;padding:15px;min-width:0}.chart-card h3{font-size:12px;margin:0 0 3px}.chart-card p{font-size:10px;color:var(--muted);margin:0 0 12px}.chart-box{height:190px;position:relative}.target-grid{display:grid;grid-template-columns:.72fr 1.28fr;gap:22px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#526157}.field input{width:100%;border:1px solid #dce4dc;border-radius:9px;padding:10px 11px;outline:none;background:#fff;color:var(--ink)}.field input:focus{border-color:#65a77d;box-shadow:0 0 0 3px #236b4b13}.target-subjects{display:grid;gap:8px}.target-row{display:grid;grid-template-columns:1fr 90px 28px;gap:8px;align-items:center}.target-row input{padding:8px;font-size:12px}.target-result{margin-top:14px;padding:13px 14px;border-radius:10px;background:#f2f7ed;color:var(--green);font-size:13px;min-height:48px}.target-result.impossible{background:#fff2f0;color:#a23e39}.modal-backdrop{position:fixed;inset:0;background:#18251ecc;z-index:10;display:grid;place-items:center;padding:18px}.modal{background:white;width:min(580px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:23px;box-shadow:0 25px 90px #0c20184d}.modal h2{margin-bottom:4px}.modal-sub{font-size:12px;color:var(--muted);margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid .wide{grid-column:1/-1}.computed{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}.computed div{background:#f4f7f3;border-radius:9px;padding:9px}.computed span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;display:block}.computed strong{font-size:14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.auth-shell{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:#f5f7f4}.auth-art{background:var(--green);color:white;padding:9vw;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.auth-art:after{content:"";position:absolute;width:580px;height:580px;border:1px solid #ffffff18;border-radius:50%;right:-170px;bottom:-200px;box-shadow:0 0 0 40px #ffffff09,0 0 0 80px #ffffff06}.auth-art h1{font-size:49px;max-width:420px;margin:18px 0}.auth-art p{color:#d4e7d8;max-width:370px}.auth-quote{font-size:12px;color:#d4e7d8}.auth-form-side{display:grid;place-items:center;padding:24px}.auth-form{width:min(390px,100%)}.auth-form h2{font-size:25px;margin:0 0 6px}.auth-form>p{color:var(--muted);margin:0 0 25px}.auth-form .field{margin-bottom:14px}.auth-form .button{width:100%;margin-top:8px;padding:12px}.auth-switch{text-align:center;font-size:12px;color:var(--muted);margin-top:17px}.link-button{border:0;background:none;color:var(--green);font-weight:700}.notice{font-size:12px;margin-top:13px;color:var(--red);min-height:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#20372a;color:white;padding:11px 16px;border-radius:10px;z-index:20;font-size:12px;box-shadow:var(--shadow)}
    @media(max-width:880px){.charts{grid-template-columns:1fr 1fr}.chart-card:last-child{grid-column:1/-1}.chart-card:last-child .chart-box{max-width:350px;margin:auto}.stats{grid-template-columns:1.2fr 1fr 1fr}}
    @media(max-width:620px){.topbar{height:62px;padding:0 16px}.wrap{padding:25px 14px 50px}.heading-row{align-items:flex-start;gap:12px}.heading-row h1{font-size:27px}.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat.hero{grid-column:1/-1}.stat-number{font-size:30px}.stat:not(.hero) .stat-number{font-size:24px}.section{padding:15px;margin-bottom:12px}.charts{grid-template-columns:1fr}.chart-card:last-child{grid-column:auto}.chart-card:last-child .chart-box{max-width:none}.target-grid{grid-template-columns:1fr;gap:14px}.semester-head{padding:12px;gap:8px}.sem-actions{margin-left:3px}.sem-gpa strong{font-size:16px}.auth-shell{grid-template-columns:1fr}.auth-art{display:none}.auth-form-side{min-height:100vh}.user-email{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <script>
    // Set these only after choosing your dedicated Supabase project.
    const SUPABASE_URL = 'https://igyknseoimqubzxjipnv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_CMhknRcZFHI8XpUIhx7q0Q_X6-VuWYP';
    const GRADE_SCALE = [
      { min: 90, letter: 'O', point: 10 }, { min: 80, letter: 'A+', point: 9 },
      { min: 70, letter: 'A', point: 8 }, { min: 60, letter: 'B+', point: 7 },
      { min: 55, letter: 'B', point: 6 }, { min: 50, letter: 'C', point: 5 },
      { min: 40, letter: 'P', point: 4 }, { min: 0, letter: 'F', point: 0 }
    ];
    const GRADE_ORDER = ['O','A+','A','B+','B','C','P','F'];
    let db = null, user = null, semesters = [], subjects = [], activeSemester = null;
    let trendChart = null, subjectChart = null, gradeChart = null, targetRows = 1;
    const $ = (s, root=document) => root.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const n = x => Number.isFinite(Number(x)) ? Number(x) : 0;
    const fmt = x => Number.isFinite(x) ? x.toFixed(2) : '0.00';
    function gradeFor(total){ return GRADE_SCALE.find(g => total >= g.min) || GRADE_SCALE.at(-1); }
    function cieValues(ia, iaMax, aat, aatMax){
      const scaledIA = n(iaMax) > 0 ? n(ia) / n(iaMax) * 30 : 0;
      const scaledAAT = n(aatMax) > 0 ? n(aat) / n(aatMax) * 20 : 0;
      return { scaledIA, scaledAAT, cie: scaledIA + scaledAAT };
    }
    function gradeOfSubject(s){ const g=gradeFor(n(s.cie_total)+n(s.see_marks)); return {...g,total:n(s.cie_total)+n(s.see_marks)}; }
    function weighted(rows){ const credits=rows.reduce((a,s)=>a+n(s.credits),0); return {credits, gpa:credits?rows.reduce((a,s)=>a+n(s.credits)*gradeOfSubject(s).point,0)/credits:0}; }
    function toast(msg){ const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),2600); }
    function appConfigReady(){ return Boolean(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase); }

    function renderAuth(message='', signup=false){
      $('#app').innerHTML=`<main class="auth-shell"><section class="auth-art"><div><div class="brand"><span class="brand-mark">✳</span><span>gradebook<small>your academic companion</small></span></div><h1>See your progress, semester by semester.</h1><p>One calm place to track your marks, understand your standing, and plan what comes next.</p></div><div class="auth-quote">Built for your journey through engineering.</div></section><section class="auth-form-side"><form class="auth-form" id="auth-form"><span class="eyebrow">Welcome ${signup?'aboard':'back'}</span><h2>${signup?'Create your account':'Sign in to Gradebook'}</h2><p>Your subjects stay private to your account.</p><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="6" placeholder="At least 6 characters"></div><button class="button primary" type="submit">${signup?'Create account':'Sign in'}</button><div class="notice" id="auth-notice">${esc(message)}</div><div class="auth-switch">${signup?'Already have an account?':'New to Gradebook?'} <button class="link-button" type="button" id="toggle-auth">${signup?'Sign in':'Create account'}</button></div></form></section></main>`;
      let isSignup=signup;
      $('#toggle-auth').onclick=()=>renderAuth('',!isSignup);
      $('#auth-form').onsubmit=async e=>{e.preventDefault();const email=$('#email').value.trim(),password=$('#password').value;const button=$('button[type=submit]',e.currentTarget);button.disabled=true;button.textContent='Please wait…';let res=isSignup?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});button.disabled=false;button.textContent=isSignup?'Create account':'Sign in';if(res.error){$('#auth-notice').textContent=res.error.message;return}if(isSignup&&!res.data.session){$('#auth-notice').style.color='var(--green)';$('#auth-notice').textContent='Check your email to confirm your account, then sign in.';return}user=res.data.user;await loadData();};
    }
    function renderSetup(){ $('#app').innerHTML=`<main class="auth-shell"><section class="auth-art"><div class="brand"><span class="brand-mark">✳</span><span>gradebook<small>your academic companion</small></span></div><div class="auth-quote">Your data belongs to you.</div></section><section class="auth-form-side"><div class="auth-form"><span class="eyebrow">One-time connection</span><h2>Connect your Supabase project</h2><p>Use the project URL and public anon/publishable key from your separate Supabase project. They are kept in this browser and are not sent anywhere else.</p><div class="field"><label>Project URL</label><input id="project-url" type="url" placeholder="https://your-project.supabase.co"></div><div class="field"><label>Anon / publishable key</label><input id="project-key" autocomplete="off" placeholder="Public browser key"></div><button class="button primary" id="connect">Connect</button><div class="notice" id="setup-notice"></div></div></section></main>`;$('#connect').onclick=()=>{const url=$('#project-url').value.trim().replace(/\/$/,''),key=$('#project-key').value.trim();if(!/^https:\/\//.test(url)||!key){$('#setup-notice').textContent='Enter a valid HTTPS project URL and public key.';return}localStorage.setItem('gradebook_supabase_url',url);localStorage.setItem('gradebook_supabase_key',key);boot();}; }
    async function boot(){
      const url=SUPABASE_URL||localStorage.getItem('gradebook_supabase_url')||'',key=SUPABASE_ANON_KEY||localStorage.getItem('gradebook_supabase_key')||'';
      if(!url||!key){renderSetup();return}
      if(!window.supabase){$('#app').innerHTML='<div class="wrap">Could not load Supabase. Check your internet connection and refresh.</div>';return}
      db=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
      const {data,error}=await db.auth.getSession();if(error){renderAuth(error.message);return}user=data.session?.user||null;
      if(user) await loadData(); else renderAuth();
    }
    async function loadData(){
      $('#app').innerHTML='<div class="wrap"><span class="eyebrow">Loading your gradebook…</span></div>';
      const [sRes,subRes]=await Promise.all([db.from('semesters').select('*').order('semester'),db.from('subjects').select('*').order('subject_name')]);
      if(sRes.error||subRes.error){renderError(sRes.error||subRes.error);return}
      semesters=sRes.data||[];subjects=subRes.data||[];activeSemester=activeSemester&&semesters.some(s=>s.id===activeSemester)?activeSemester:(semesters[0]?.id||null);renderDashboard();
    }
    function renderError(err){$('#app').innerHTML=`<div class="wrap"><div class="section"><h2>Couldn’t load your gradebook</h2><p class="subhead">${esc(err.message)}. Apply the SQL setup provided with this app, then refresh.</p><button class="button soft" id="retry">Try again</button> <button class="button ghost" id="logout">Sign out</button></div></div>`;$('#retry').onclick=loadData;$('#logout').onclick=()=>db.auth.signOut().then(()=>renderAuth());}
    async function refresh(){const [a,b]=await Promise.all([db.from('semesters').select('*').order('semester'),db.from('subjects').select('*').order('subject_name')]);if(a.error||b.error){toast((a.error||b.error).message);return}semesters=a.data;subjects=b.data;renderDashboard();}
    function renderDashboard(){
      const overall=weighted(subjects),bySem=semesters.map(s=>({sem:s,rows:subjects.filter(x=>x.semester_id===s.id)}));
      $('#app').innerHTML=`<header class="topbar"><div class="brand"><span class="brand-mark">✳</span><span>gradebook<small>your academic companion</small></span></div><div class="user-tools"><span class="user-email">${esc(user?.email||'')}</span><button class="button soft small" id="signout">Sign out</button></div></header><main class="wrap"><div class="heading-row"><div><span class="eyebrow">Your overview</span><h1>Academic dashboard</h1><p class="subhead">A clear view of where you are and what’s ahead.</p></div><button class="button primary" id="add-semester">＋ Add semester</button></div><section class="stats"><article class="stat hero"><div class="stat-label">Cumulative GPA</div><div class="stat-number">${subjects.length?fmt(overall.gpa):'—'}</div><div class="stat-foot">${subjects.length?`${overall.credits} credits across ${semesters.length} semesters`:'Add subjects to start tracking'}</div></article><article class="stat"><div class="stat-label">Semesters</div><div class="stat-number">${semesters.length}</div><div class="stat-foot">${subjects.length} subjects recorded</div></article><article class="stat"><div class="stat-label">Credits earned</div><div class="stat-number">${overall.credits}</div><div class="stat-foot">VTU 10-point grading</div></article></section>
        <section class="section"><div class="section-head"><div><h2>Semester breakdown</h2><p>Add marks and watch your results update live.</p></div></div><div class="semester-list">${bySem.length?bySem.map(({sem,rows})=>semesterMarkup(sem,rows)).join(''):'<div class="empty">No semesters yet. Add your first semester to begin.</div>'}</div></section>
        <section class="section"><div class="section-head"><div><h2>Visual analytics</h2><p>Trends and grade distribution across your subjects.</p></div></div><div class="charts"><article class="chart-card"><h3>SGPA trend</h3><p>Semester performance over time</p><div class="chart-box"><canvas id="trend-chart"></canvas></div></article><article class="chart-card"><h3>Subject grade points</h3><p>Grade point earned in each subject</p><div class="chart-box"><canvas id="subject-chart"></canvas></div></article><article class="chart-card"><h3>Grade distribution</h3><p>Grades across all subjects</p><div class="chart-box"><canvas id="grade-chart"></canvas></div></article></div></section>
        <section class="section"><div class="section-head"><div><h2>Plan your target CGPA</h2><p>Estimate the grades needed across your remaining subjects.</p></div></div><div class="target-grid"><div><div class="field"><label for="target-cgpa">Target CGPA</label><input id="target-cgpa" type="number" min="0" max="10" step="0.01" placeholder="e.g. 8.50"></div><div id="target-result" class="target-result">Enter your target and remaining subjects to see what you need.</div></div><div><div class="target-subjects" id="target-subjects"></div><button class="button soft small" id="add-target-row" style="margin-top:9px">＋ Add subject</button></div></div></section>
      </main>`;
      $('#signout').onclick=async()=>{await db.auth.signOut();user=null;renderAuth()};$('#add-semester').onclick=addSemester;$('#add-target-row').onclick=()=>{targetRows++;renderTargetRows()};
      document.querySelectorAll('[data-add-subject]').forEach(b=>b.onclick=()=>openSubject(null,b.dataset.semester));document.querySelectorAll('[data-edit-subject]').forEach(b=>b.onclick=()=>openSubject(subjects.find(s=>s.id===b.dataset.editSubject)));document.querySelectorAll('[data-delete-subject]').forEach(b=>b.onclick=()=>deleteSubject(b.dataset.deleteSubject));document.querySelectorAll('[data-delete-semester]').forEach(b=>b.onclick=()=>deleteSemester(b.dataset.deleteSemester));
      targetRows=1;renderTargetRows();$('#target-cgpa').oninput=calculateTarget;drawCharts(bySem);
    }
    function semesterMarkup(sem,rows){const result=weighted(rows);return `<article class="semester-card"><div class="semester-head"><div><h3>Semester ${esc(sem.semester)}</h3><div class="sem-meta">${rows.length} subject${rows.length===1?'':'s'} · ${result.credits} credits</div></div><div class="sem-gpa"><strong>${rows.length?fmt(result.gpa):'—'}</strong><span>SGPA</span></div><div class="sem-actions"><button class="button soft small" data-add-subject data-semester="${esc(sem.id)}">＋ Subject</button><button class="icon-btn" title="Remove semester" data-delete-semester="${esc(sem.id)}">⋯</button></div></div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>Subject</th><th>Credits</th><th>IA · /30</th><th>AAT · /20</th><th>CIE</th><th>SEE</th><th>Total</th><th>Grade</th><th>GP</th><th></th></tr></thead><tbody>${rows.map(subjectMarkup).join('')}</tbody></table></div>`:'<div class="empty">No subjects yet. Add one to calculate SGPA.</div>'}</article>`}
    function subjectMarkup(s){const g=gradeOfSubject(s);return `<tr><td><div class="subject-name">${esc(s.subject_name)}</div><div class="subscore">Raw IA ${fmt(s.ia_raw_marks)}/${fmt(s.ia_raw_max)} · AAT ${fmt(s.aat_raw_marks)}/${fmt(s.aat_raw_max)}</div></td><td>${n(s.credits)}</td><td>${fmt(cieValues(s.ia_raw_marks,s.ia_raw_max,0,1).scaledIA)}</td><td>${fmt(cieValues(0,1,s.aat_raw_marks,s.aat_raw_max).scaledAAT)}</td><td>${fmt(s.cie_total)}</td><td>${n(s.see_marks)}</td><td>${fmt(g.total)}</td><td><span class="grade-pill ${g.point===0?'fail':''}">${g.letter}</span></td><td><strong>${g.point}</strong></td><td><div class="row-actions"><button class="icon-btn" title="Edit" data-edit-subject="${esc(s.id)}">✎</button><button class="icon-btn" title="Delete" data-delete-subject="${esc(s.id)}">×</button></div></td></tr>`}
    async function addSemester(){const next=Math.max(0,...semesters.map(s=>n(s.semester)))+1;const {data,error}=await db.from('semesters').insert({user_id:user.id,semester:next}).select().single();if(error){toast(error.message);return}semesters.push(data);activeSemester=data.id;renderDashboard()}
    async function deleteSemester(id){const sem=semesters.find(s=>s.id===id);if(!sem)return;if(!confirm(`Delete Semester ${sem.semester} and all its subjects?`))return;const {error}=await db.from('semesters').delete().eq('id',id);if(error){toast(error.message);return}semesters=semesters.filter(s=>s.id!==id);subjects=subjects.filter(s=>s.semester_id!==id);renderDashboard()}
    async function deleteSubject(id){if(!confirm('Delete this subject?'))return;const {error}=await db.from('subjects').delete().eq('id',id);if(error){toast(error.message);return}subjects=subjects.filter(s=>s.id!==id);renderDashboard()}
    function openSubject(subject,semesterId){const edit=Boolean(subject);const s=subject||{semester_id:semesterId,subject_name:'',credits:3,ia_raw_marks:0,ia_raw_max:30,aat_raw_marks:0,aat_raw_max:10,see_marks:0};
      $('#modal-root').innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h2>${edit?'Edit subject':'Add subject'}</h2><p class="modal-sub">Raw marks scale automatically into VTU CIE components.</p><form id="subject-form"><div class="form-grid"><div class="field wide"><label>Subject name</label><input name="subject_name" required maxlength="100" value="${esc(s.subject_name)}" placeholder="e.g. Engineering Mathematics"></div><div class="field"><label>Credits</label><input name="credits" type="number" min="1" max="30" step="1" required value="${n(s.credits)}"></div><div class="field"><label>SEE marks · /50</label><input name="see_marks" type="number" min="0" max="50" step="1" required value="${n(s.see_marks)}"></div><div class="field"><label>IA raw marks</label><input name="ia_raw_marks" type="number" min="0" step="any" required value="${n(s.ia_raw_marks)}"></div><div class="field"><label>IA raw maximum</label><input name="ia_raw_max" type="number" min="0.01" step="any" required value="${n(s.ia_raw_max)}"></div><div class="field"><label>AAT raw marks</label><input name="aat_raw_marks" type="number" min="0" step="any" required value="${n(s.aat_raw_marks)}"></div><div class="field"><label>AAT raw maximum</label><input name="aat_raw_max" type="number" min="0.01" step="any" required value="${n(s.aat_raw_max)}"></div></div><div class="computed"><div><span>Scaled IA /30</span><strong id="live-ia">—</strong></div><div><span>Scaled AAT /20</span><strong id="live-aat">—</strong></div><div><span>CIE /50</span><strong id="live-cie">—</strong></div><div><span>Grade · GP</span><strong id="live-grade">—</strong></div></div><div class="modal-actions"><button class="button soft" type="button" id="cancel-subject">Cancel</button><button class="button primary" type="submit">${edit?'Save changes':'Add subject'}</button></div></form></section></div>`;
      const form=$('#subject-form'),update=()=>{const d=Object.fromEntries(new FormData(form));const c=cieValues(d.ia_raw_marks,d.ia_raw_max,d.aat_raw_marks,d.aat_raw_max),g=gradeFor(c.cie+n(d.see_marks));$('#live-ia').textContent=fmt(c.scaledIA);$('#live-aat').textContent=fmt(c.scaledAAT);$('#live-cie').textContent=fmt(c.cie);$('#live-grade').textContent=`${g.letter} · ${g.point}`};form.oninput=update;update();$('#cancel-subject').onclick=()=>$('#modal-root').innerHTML='';$('#modal-backdrop').onclick=e=>{if(e.target.id==='modal-backdrop')$('#modal-root').innerHTML=''};
      form.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(form)),ia=n(d.ia_raw_marks),iaMax=n(d.ia_raw_max),aat=n(d.aat_raw_marks),aatMax=n(d.aat_raw_max),see=n(d.see_marks);if(ia>iaMax||aat>aatMax||see>50){toast('Marks cannot exceed their entered maximum. SEE maximum is 50.');return}const c=cieValues(ia,iaMax,aat,aatMax),g=gradeFor(c.cie+see);const payload={user_id:user.id,semester_id:s.semester_id,subject_name:d.subject_name.trim(),credits:n(d.credits),ia_raw_marks:ia,ia_raw_max:iaMax,aat_raw_marks:aat,aat_raw_max:aatMax,cie_total:Number(c.cie.toFixed(4)),see_marks:see,grade:g.letter,grade_point:g.point};const res=edit?await db.from('subjects').update(payload).eq('id',s.id):await db.from('subjects').insert(payload);if(res.error){toast(res.error.message);return}$('#modal-root').innerHTML='';await refresh();toast(edit?'Subject updated':'Subject added')};
    }
    function drawCharts(bySem){if(!window.Chart)return;[trendChart,subjectChart,gradeChart].forEach(c=>c?.destroy());const palette=['#236b4b','#77aa66','#d9a85c','#ec8d5e','#7895ad','#a47ba0','#79b7a4','#bb6f66'];const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{color:'#718077',font:{size:9}}},y:{beginAtZero:true,grid:{color:'#eef1ed'},ticks:{color:'#718077',font:{size:9}}}}};trendChart=new Chart($('#trend-chart'),{type:'line',data:{labels:bySem.map(x=>`Sem ${x.sem.semester}`),datasets:[{data:bySem.map(x=>weighted(x.rows).gpa),borderColor:'#236b4b',backgroundColor:'#236b4b1a',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:'#236b4b'}]},options:{...common,scales:{...common.scales,y:{...common.scales.y,max:10}}}});subjectChart=new Chart($('#subject-chart'),{type:'bar',data:{labels:subjects.map(s=>s.subject_name.length>14?s.subject_name.slice(0,13)+'…':s.subject_name),datasets:[{data:subjects.map(s=>gradeOfSubject(s).point),backgroundColor:subjects.map((_,i)=>palette[i%palette.length]),borderRadius:5}]},options:{...common,scales:{...common.scales,y:{...common.scales.y,max:10,ticks:{stepSize:2,color:'#718077',font:{size:9}}}}}});const counts=GRADE_ORDER.map(g=>subjects.filter(s=>gradeOfSubject(s).letter===g).length);gradeChart=new Chart($('#grade-chart'),{type:'doughnut',data:{labels:GRADE_ORDER,datasets:[{data:counts,backgroundColor:palette,borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,cutout:'68%',plugins:{legend:{position:'bottom',labels:{boxWidth:8,padding:9,font:{size:9}}}}}})}
    function renderTargetRows(){const el=$('#target-subjects');if(!el)return;el.innerHTML=Array.from({length:targetRows},(_,i)=>`<div class="target-row"><input aria-label="Remaining subject ${i+1} name" data-target-name placeholder="Subject ${i+1}" value="${esc(el.querySelectorAll('[data-target-name]')[i]?.value||'')}"><input aria-label="Credits" data-target-credit type="number" min="1" max="30" value="${esc(el.querySelectorAll('[data-target-credit]')[i]?.value||3)}"><button type="button" class="icon-btn" data-remove-target="${i}" title="Remove">×</button></div>`).join('');el.querySelectorAll('input').forEach(x=>x.oninput=calculateTarget);el.querySelectorAll('[data-remove-target]').forEach(b=>b.onclick=()=>{if(targetRows>1){targetRows--;renderTargetRows();calculateTarget()}});calculateTarget()}
    function calculateTarget(){const out=$('#target-result'),target=n($('#target-cgpa')?.value);if(!out)return;const rows=[...document.querySelectorAll('[data-target-credit]')].map(x=>n(x.value)).filter(x=>x>0),remaining=rows.reduce((a,x)=>a+x,0),done=weighted(subjects);if(!target||!remaining){out.className='target-result';out.textContent='Enter your target and remaining subjects to see what you need.';return}const needed=(target*(done.credits+remaining)-done.gpa*done.credits)/remaining,max=(done.gpa*done.credits+10*remaining)/(done.credits+remaining);if(needed>10){out.className='target-result impossible';out.innerHTML=`Not achievable with these credits — maximum possible CGPA is <strong>${fmt(max)}</strong>.`;return}if(needed<=0){out.className='target-result';out.innerHTML='You have already secured this target with your current credits.';return}const combinations=findCombination(rows,needed);out.className='target-result';out.innerHTML=`You need an average of <strong>${fmt(needed)} grade points</strong> across ${remaining} remaining credits.${combinations?` Nearest achievable plan: <strong>${combinations}</strong>.`:''}`}
    function findCombination(credits,needed){if(credits.length>12||credits.reduce((a,b)=>a+b,0)>90)return '';const choices=GRADE_SCALE.map(g=>g.point).sort((a,b)=>a-b);let best=null,bestAvg=Infinity;function walk(i,sum,labels){if(i===credits.length){const avg=sum/credits.reduce((a,b)=>a+b,0);if(avg>=needed-1e-8&&avg<bestAvg){bestAvg=avg;best=[...labels]}return}for(const p of choices){labels[i]=GRADE_SCALE.find(g=>g.point===p)?.letter;walk(i+1,sum+p*credits[i],labels)}}walk(0,0,[]);if(!best)return '';const counts={};best.forEach(g=>counts[g]=(counts[g]||0)+1);return Object.entries(counts).map(([g,count])=>`${count} ${g}${count>1?'s':''}`).join(', ')}
    boot();
  </script>
